---
name: Environment installation
description: Install the Rust toolchain and restore the cargo cache
inputs:
  targets:
    description: "Comma-separated list of additional Rust targets to install"
    required: false
    default: ""
  components:
    description: "Comma-separated list of additional Rust components to install"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ inputs.targets }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cargo-${{ inputs.targets }}-
