---
name: CI

on:
  workflow_call: ~
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Bump this when a new nfpm release is available.
  NFPM_VERSION: "2.46.3"

## Concurrency only allowed in the main branch.
## So old builds running for old commits within the same Pull Request are cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all

  build:
    needs:
      - test
    strategy:
      matrix:
        os:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install
        with:
          targets: ${{ matrix.os.target }}

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Build static release binary
        run: cargo build --release --target ${{ matrix.os.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: fix-perms-${{ matrix.os.arch }}
          path: target/${{ matrix.os.target }}/release/fix-perms
          if-no-files-found: error

  package:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    needs:
      - build
    strategy:
      matrix:
        os:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install

      - uses: actions/download-artifact@v8
        with:
          name: fix-perms-${{ matrix.os.arch }}
          path: target/${{ matrix.os.target }}/release/

      - name: Restore binary permissions
        run: chmod +x target/${{ matrix.os.target }}/release/fix-perms

      - name: Install nfpm
        run: |
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_$(dpkg --print-architecture).deb" \
            -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
          rm /tmp/nfpm.deb

      - name: Build packages
        run: cargo xtask build --target ${{ matrix.os.target }}

      - uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - uses: actions/upload-artifact@v7
        with:
          name: ignity-utils-rs-packages-${{ matrix.os.arch }}
          path: "dist/*"
          if-no-files-found: error

  sanitize:
    needs:
      - package
    strategy:
      matrix:
        os:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ignity-utils-rs-packages-${{ matrix.os.arch }}
          path: dist

      - name: Prepare smoke test
        run: |
          mkdir -p /tmp/smoke/dir
          touch /tmp/smoke/dir/file
          echo "/tmp/smoke $(id -u):$(id -g) 0600 0700" > /tmp/smoke.spec

      - name: Verify deb install
        run: |
          sudo dpkg -i dist/ignity-utils-rs_*.deb
          fix-perms < /tmp/smoke.spec
          test "$(stat -c %a /tmp/smoke/dir)" = "700"
          test "$(stat -c %a /tmp/smoke/dir/file)" = "600"
          sudo dpkg -r ignity-utils-rs

      - name: Verify rpm install
        run: |
          sudo apt-get install -qy rpm
          sudo rpm -i --nodeps dist/ignity-utils-rs-*.rpm
          chmod -R 0777 /tmp/smoke
          fix-perms < /tmp/smoke.spec
          test "$(stat -c %a /tmp/smoke/dir)" = "700"
          test "$(stat -c %a /tmp/smoke/dir/file)" = "600"
